<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" aria-label="A chibi adventurer walking across the screen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3042"/>
      <stop offset="1" stop-color="#5a6280"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="190" rx="18"/></clipPath>
  </defs>

  <style>
    .walk { animation: across 16s linear infinite; }
    @keyframes across { from { transform: translateX(-70px); } to { transform: translateX(870px); } }

    .bob { animation: bob .6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .limb { transform-box: fill-box; transform-origin: 50% 0%; }
    .l1, .a2 { animation: swingA .6s ease-in-out infinite alternate; }
    .l2, .a1 { animation: swingB .6s ease-in-out infinite alternate; }
    @keyframes swingA { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
    @keyframes swingB { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }

    .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: flap .6s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }

    .cloud1 { animation: drift 40s linear infinite; }
    .cloud2 { animation: drift 55s linear infinite; animation-delay: -20s; }
    @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(920px); } }

    .star { animation: tw 2.4s ease-in-out infinite; }
    .s2 { animation-delay: -.8s; }
    .s3 { animation-delay: -1.6s; }
    @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#clip)">
    <!-- sky panel -->
    <rect width="800" height="190" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ece5d8">
      <circle class="star" cx="60" cy="40" r="1.6"/>
      <circle class="star s2" cx="170" cy="70" r="1.2"/>
      <circle class="star s3" cx="290" cy="30" r="1.6"/>
      <circle class="star" cx="420" cy="60" r="1.2"/>
      <circle class="star s2" cx="540" cy="36" r="1.6"/>
      <circle class="star s3" cx="650" cy="72" r="1.2"/>
      <circle class="star" cx="740" cy="34" r="1.6"/>
    </g>

    <!-- title -->
    <text x="400" y="28" text-anchor="middle" fill="#d3bc8e" font-family="Georgia, serif" font-size="15" letter-spacing="2">✦ Traveling through the code realm ✦</text>

    <!-- clouds -->
    <g class="cloud1" opacity=".5">
      <ellipse cx="0" cy="62" rx="32" ry="9" fill="#ece5d8"/>
      <ellipse cx="14" cy="55" rx="18" ry="9" fill="#ece5d8"/>
    </g>
    <g class="cloud2" opacity=".35">
      <ellipse cx="0" cy="90" rx="26" ry="7" fill="#ece5d8"/>
      <ellipse cx="-10" cy="84" rx="14" ry="7" fill="#ece5d8"/>
    </g>

    <!-- hills -->
    <path d="M0,152 C80,110 160,120 240,140 C320,100 420,105 500,138 C580,112 680,108 800,140 L800,152 Z" fill="#343b50"/>

    <!-- ground -->
    <rect y="152" width="800" height="38" fill="#20242f"/>
    <line x1="0" y1="152" x2="800" y2="152" stroke="#d3bc8e" stroke-opacity=".6" stroke-width="2"/>
    <g fill="#d3bc8e" opacity=".35">
      <circle cx="90" cy="168" r="2"/><circle cx="210" cy="176" r="1.6"/>
      <circle cx="350" cy="166" r="2"/><circle cx="480" cy="178" r="1.6"/>
      <circle cx="610" cy="168" r="2"/><circle cx="730" cy="176" r="1.6"/>
    </g>

    <!-- the walker (feet at y=0 of this group) -->
    <g transform="translate(0,150)">
      <g class="walk">
        <!-- shadow -->
        <ellipse cx="0" cy="2" rx="18" ry="3.5" fill="#000" opacity=".3"/>

        <g class="bob">
          <!-- scarf tail -->
          <g class="tail">
            <path d="M-10,-44 q-14,2 -22,10 q-6,6 -2,10 l6,-3 q6,-10 20,-12 z" fill="#3fb8af"/>
          </g>

          <!-- back leg + back arm -->
          <g class="limb l2">
            <rect x="2" y="-19" width="8" height="17" rx="3.5" fill="#2d3436"/>
            <ellipse cx="6" cy="-2" rx="6.5" ry="3.5" fill="#a1785a"/>
          </g>
          <g class="limb a2">
            <rect x="-14" y="-42" width="6" height="16" rx="3" fill="#3d4a73"/>
            <circle cx="-11" cy="-25" r="3.2" fill="#ffe2c6"/>
          </g>

          <!-- backpack -->
          <rect x="-25" y="-44" width="15" height="23" rx="5" fill="#a1785a"/>
          <rect x="-25" y="-44" width="15" height="8" rx="4" fill="#8a6445"/>
          <circle cx="-17.5" cy="-34" r="2" fill="#d3bc8e"/>

          <!-- front leg -->
          <g class="limb l1">
            <rect x="-10" y="-19" width="8" height="17" rx="3.5" fill="#2d3436"/>
            <ellipse cx="-6" cy="-2" rx="6.5" ry="3.5" fill="#a1785a"/>
          </g>

          <!-- tunic + belt -->
          <rect x="-12" y="-45" width="24" height="28" rx="10" fill="#4a5a8a"/>
          <rect x="-12" y="-30" width="24" height="4" fill="#d3bc8e"/>
          <rect x="-2" y="-31" width="5" height="6" rx="1.5" fill="#ece5d8"/>

          <!-- scarf -->
          <rect x="-13" y="-47" width="26" height="8" rx="4" fill="#3fb8af"/>

          <!-- front arm -->
          <g class="limb a1">
            <rect x="8" y="-42" width="6" height="16" rx="3" fill="#4a5a8a"/>
            <circle cx="11" cy="-25" r="3.2" fill="#ffe2c6"/>
          </g>

          <!-- head -->
          <circle cx="0" cy="-64" r="20" fill="#ffe2c6"/>

          <!-- hair -->
          <ellipse cx="-18" cy="-58" rx="5.5" ry="10" fill="#2b2d5e"/>
          <path d="M-21,-62 C-25,-90 25,-92 21,-62 C16,-72 8,-76 0,-74 C-8,-78 -16,-72 -21,-62 Z" fill="#2b2d5e"/>
          <path d="M-2,-84 q4,-11 11,-6 q-5,2 -4,9 z" fill="#2b2d5e"/>

          <!-- goggles on forehead -->
          <path d="M-14,-79 L12,-80" stroke="#d3bc8e" stroke-width="2.4" fill="none"/>
          <circle cx="-7" cy="-79" r="5" fill="#74b9ff" fill-opacity=".85" stroke="#d3bc8e" stroke-width="2"/>
          <circle cx="6" cy="-80" r="5" fill="#74b9ff" fill-opacity=".85" stroke="#d3bc8e" stroke-width="2"/>

          <!-- face -->
          <ellipse cx="5" cy="-62" rx="3.3" ry="4.6" fill="#1e1e3a"/>
          <ellipse cx="15" cy="-62" rx="3.3" ry="4.6" fill="#1e1e3a"/>
          <circle cx="6" cy="-64" r="1.3" fill="#fff"/>
          <circle cx="16" cy="-64" r="1.3" fill="#fff"/>
          <ellipse cx="0" cy="-54" rx="4" ry="2.4" fill="#ff9aa2" opacity=".6"/>
          <ellipse cx="18" cy="-54" rx="3.4" ry="2.2" fill="#ff9aa2" opacity=".6"/>
          <path d="M7,-54 q3.5,3.5 7,0" stroke="#b5656b" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- frame -->
  <rect x="1" y="1" width="798" height="188" rx="17" fill="none" stroke="#d3bc8e" stroke-opacity=".5" stroke-width="2"/>
</svg>
