<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 3.2s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(.4) rotate(0deg);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
.sh{opacity:0;animation:sh 9s linear infinite}
@keyframes sh{0%{opacity:0;transform:translate(var(--x),var(--y))}3%{opacity:1}12%{opacity:0;transform:translate(calc(var(--x) + 280px),calc(var(--y) + 140px))}100%{opacity:0;transform:translate(calc(var(--x) + 280px),calc(var(--y) + 140px))}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.82}50%{opacity:1}}
.moon{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
