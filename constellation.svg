<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.flow{animation:flow 2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.8);opacity:0}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9) rotate(0deg)}50%{transform:scale(1.15) rotate(20deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
text{font-family:Georgia,'Times New Roman',serif}
</style>
